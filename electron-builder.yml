# Packaging config.
#
# Produces a single self-contained Windows installer: Electron runtime, the
# app, and JsSIP all inside it. Nothing else has to be installed — no Node, no
# npm, no separate Electron download.

appId: com.alexk.dialtone
productName: Dialtone
copyright: Copyright © Alex Kotrotsios

directories:
  output: dist
  buildResources: build

# Everything the app needs at runtime, and nothing else.
#
# `vendor/` is generated by `npm run build:vendor` and is gitignored, but it
# is the JsSIP bundle the renderer loads — leaving it out produces an app that
# installs cleanly and cannot make a call.
#
# `test/` and `tools/` are development-only and would only bloat the download.
files:
  - main.js
  - preload.js
  - preload-toast.js
  - package.json
  - src/**/*
  - vendor/**/*
  - build/icon.ico
  - build/icon.png
  - '!**/*.map'

# jssip is bundled into vendor/ at build time, so the runtime never requires
# it from node_modules. Nothing else is a runtime dependency.
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Unsigned. Windows SmartScreen will warn on first run — see SETUP.md.
  # Signing needs a certificate that costs money and is tied to an identity;
  # not worth it for an app you install on your own machines.
  signAndEditExecutable: true

nsis:
  # Per-user install: no admin prompt, and the login item and settings live
  # under the same user anyway.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dialtone
  # Uninstall should not silently bin the call history and contacts. The
  # installer asks; %APPDATA%\dialtone survives by default.
  deleteAppDataOnUninstall: false
  artifactName: Dialtone-Setup-${version}.${ext}
  uninstallDisplayName: Dialtone ${version}
  # Running installer + a running app is how you get a half-replaced install.
  allowElevation: true
