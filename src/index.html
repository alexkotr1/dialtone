<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' ws: wss: https:;"
    />
    <title>Dialtone</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <div class="titlebar">
        <div class="brand">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z" />
          </svg>
          DIALTONE
        </div>
        <div class="spacer"></div>
        <button class="call-pill" id="callPill" title="Return to call">
          <i class="dot"></i>
          <span id="callPillTime">00:00</span>
          <i class="end" id="callPillEnd">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </i>
        </button>
        <div class="spacer"></div>
        <div class="win-controls">
          <button id="winMin" title="Minimise" aria-label="Minimise">
            <svg width="11" height="11" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button id="winMax" title="Maximise" aria-label="Maximise">
            <svg id="maxIcon" width="11" height="11" viewBox="0 0 12 12"><rect x="1.2" y="1.2" width="9.6" height="9.6" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button id="winClose" class="close" title="Close" aria-label="Close">
            <svg width="11" height="11" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
        </div>
      </div>

      <div class="body">
        <nav class="rail" id="rail"></nav>

        <div class="views" id="views">
          <section class="view dialer" data-view="dialer" id="viewDialer"></section>
          <section class="view split" data-view="recents" id="viewRecents"></section>
          <section class="view split" data-view="contacts" id="viewContacts"></section>
          <section class="view" data-view="settings" id="viewSettings"></section>

          <div class="callscreen" id="callscreen"></div>
          <div class="scrim" id="scrim"></div>
          <div class="toasts" id="toasts"></div>
        </div>
      </div>
    </div>

    <!-- Remote audio. Autoplay is fine here: it only ever carries a stream the
         user answered or placed themselves. -->
    <audio id="remoteAudio" autoplay></audio>

    <script src="../vendor/jssip.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
